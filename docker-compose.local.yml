# ============================================================
# ENTORNO: DESARROLLO LOCAL (hot reload)
# Comando: docker compose -f docker-compose.local.yml up
# Acceso:  http://localhost:5173
#
# Los cambios en src/ se reflejan AUTOMÁTICAMENTE en el
# navegador sin necesidad de reiniciar el contenedor.
# ============================================================

services:
  biase-local:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: biase-dev-local
    ports:
      - "5173:8080"
    volumes:
      # Monta el código fuente para hot reload
      - .:/app
      # Volumen separado para node_modules (evita conflictos macOS/Linux)
      - biase_node_modules:/app/node_modules
    env_file:
      # Copia .env.example -> .env.local y completa tus claves reales
      # required: false → Docker no falla si el archivo no existe aún
      - path: .env.local
        required: false
    environment:
      # Activa polling para hot reload en Docker sobre macOS/Windows
      - VITE_USE_POLLING=true
    restart: unless-stopped

volumes:
  biase_node_modules:
